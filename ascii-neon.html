<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEON ASCII Pipeline</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#7fe9bd;font:13px ui-monospace,Menlo,Consolas,monospace}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #102a22}
h1{font-size:14px;margin:0;letter-spacing:.18em;color:#b05cff;text-shadow:0 0 10px #8a3cff}
#fps{color:#10dc8c}
.stage{padding:8px 14px}
canvas{display:block;width:100%;height:auto;background:#000;border:1px solid #0d2a20;border-radius:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:6px 14px}
button,label.btn{background:#050f0b;color:#10dc8c;border:1px solid #145b40;padding:7px 12px;border-radius:4px;font:inherit;cursor:pointer}
button:hover,label.btn:hover,button.on{background:#0b2a1f;border-color:#b05cff;color:#e0b8ff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;padding:6px 14px 18px}
.grid label{display:flex;flex-direction:column;gap:3px;color:#5fb894}
input[type=range]{accent-color:#a855ff;width:100%}
#msg{padding:0 14px;color:#b05cff;min-height:18px}
#app{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:0 6px;align-items:start;max-width:1700px;margin:0 auto}
.right{max-height:calc(100vh - 54px);overflow:auto;position:sticky;top:0;border-left:1px solid #102a22}
.right .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
#app.theatre{grid-template-columns:minmax(0,1fr)}
#app.theatre .right{max-height:none;position:static;border-left:0}
#app.theatre .right .grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
#app.theatre .stage{padding:0}
#app.theatre canvas{border-radius:0;border-left:0;border-right:0;max-height:82vh;object-fit:contain}
@media(max-width:900px){#app{grid-template-columns:minmax(0,1fr)}.right{position:static;max-height:none;border-left:0}}
canvas:fullscreen{width:100vw;height:100vh;object-fit:contain;border:0}
canvas:-webkit-full-screen{width:100vw;height:100vh;object-fit:contain;border:0}
.tp{display:flex;align-items:center;gap:8px;padding:0 14px 4px}.tp input[type=range]{flex:1}
select{background:#050f0b;color:#10dc8c;border:1px solid #145b40;border-radius:4px;padding:4px}
#help{display:none;position:fixed;right:14px;bottom:14px;background:#050f0bee;border:1px solid #b05cff;border-radius:6px;padding:12px 16px;line-height:1.7;z-index:9}#help.show{display:block}
:root{--p:#10dc8c;--s:#a855ff;--tx:#7fe9bd;--dim:#5fb894;--bd0:#102a22;--bd:#145b40;--bg:#050f0b;--bgh:#0b2a1f;--hov:#e0b8ff}
body{color:var(--tx)}
header,.right{border-color:var(--bd0)}
h1{color:var(--s);text-shadow:0 0 10px var(--s)}
#fps{color:var(--p)}
canvas{border-color:var(--bd0)}
button,label.btn,select{background:var(--bg);color:var(--p);border-color:var(--bd)}
button:hover,label.btn:hover,button.on{background:var(--bgh);border-color:var(--s);color:var(--hov)}
.grid label{color:var(--dim)}
input[type=range],input[type=checkbox]{accent-color:var(--s)}
#msg{color:var(--s)}
#help{border-color:var(--s);background:var(--bg)}
select option{background:#000;color:var(--p)}
html,.right{scrollbar-color:var(--bd) #000}
::selection{background:var(--s);color:#000}
.pal{padding:10px 14px 0;display:flex;flex-direction:column;gap:8px;max-width:460px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--dim)}
.lh{display:flex;align-items:center;gap:6px}
.sw{display:flex;gap:8px}.sw button{flex:1;display:flex;align-items:center;gap:8px}
.sw i{width:14px;height:14px;border-radius:3px;border:1px solid #fff4;display:inline-block}
#sv{position:relative;height:150px;border-radius:6px;cursor:crosshair;touch-action:none;border:1px solid var(--bd)}
#svh,#hbh{position:absolute;width:14px;height:14px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #0008;pointer-events:none}
#hb{position:relative;height:10px;border-radius:6px;cursor:pointer;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#hbh{top:50%}
.hx{display:flex;align-items:center;gap:6px;border:2px solid var(--s);border-radius:8px;padding:6px 10px;color:var(--dim);font-size:15px}
.hx input{background:transparent;border:0;outline:0;color:var(--tx);font:inherit;width:100%;text-transform:uppercase}
.qm{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border:1px solid var(--bd);border-radius:50%;font-size:10px;color:var(--dim);cursor:help;user-select:none;flex:none}
.qm:hover{border-color:var(--s);color:var(--hov)}
.pal:not(.open) .sw,.pal:not(.open) #sv,.pal:not(.open) #hb,.pal:not(.open) .hx{display:none}
#tip{display:none;position:fixed;z-index:20;max-width:240px;background:var(--bg);border:1px solid var(--s);color:var(--tx);padding:8px 10px;border-radius:6px;line-height:1.45;font-size:12px;pointer-events:none}
</style></head><body>
<header><h1>NEON//ASCII PIPELINE</h1><span id="fps">-- fps</span></header>
<main id="app"><section class="left">
<div class="stage"><canvas id="out" width="1120" height="630"></canvas></div>
<div class="tp"><button id="bPlay">Pause</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="tm">live</span><select id="spd"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select></div>
<div id="msg">Tip: drag a video onto the player. T = theatre mode, F = fullscreen, ? = all shortcuts.</div>
<div class="bar">
<button id="bDemo" class="on">Demo feed</button><button id="bCam">Webcam</button>
<label class="btn">Load video<input id="file" type="file" accept="video/*" hidden></label><button id="bMic">Mic reactive</button><button id="bRec">Record</button><button id="bSnap">Snapshot</button><button id="bReset">Reset settings</button>
</div>
</section><aside class="right">
<div class="pal">
<div class="ph"><b>Palette</b><select id="pal"><option value="violet">Violet + emerald</option><option value="toxic">Toxic emerald</option><option value="ultra">Ultraviolet</option><option value="custom">Custom</option></select></div>
<div class="sw"><button id="swP" class="on"><i id="swPc"></i>Primary</button><button id="swS"><i id="swSc"></i>Accent</button></div>
<div id="sv"><div id="svh"></div></div>
<div id="hb"><div id="hbh"></div></div>
<div class="hx"><span>#</span><input id="hex" maxlength="6" spellcheck="false"></div>
</div>
<div class="grid">
<label>Columns <input id="cols" type="range" min="60" max="280" value="150"></label>
<label>Temporal smoothing <input id="smooth" type="range" min="0" max="90" value="45"></label>
<label>Contrast <input id="contrast" type="range" min="50" max="220" value="115"></label>
<label>Glow <input id="glow" type="range" min="0" max="100" value="70"></label>
<label>Sparks <input id="sparks" type="range" min="0" max="100" value="60"></label>
<label>Edge tracking <input id="edge" type="range" min="0" max="100" value="55"></label>
<label>Afterglow trails <input id="trail" type="range" min="0" max="100" value="40"></label>

<label>Charset <select id="set"><option value="classic">Classic</option><option value="dense">Dense</option><option value="kana">Matrix kana</option><option value="blocks">Blocks</option></select></label>
<label>Speed preset <select id="perf"><option value="custom">Custom</option><option value="fast">Max FPS</option><option value="bal">Balanced</option><option value="max">Max quality</option></select></label>
<label>Render quality <select id="qual"><option value="1">Standard</option><option value="1.6" selected>HD</option><option value="2.2">Ultra HD</option></select></label>
<label>Hue shift <input id="hue" type="range" min="0" max="360" value="0"></label>
<label>Glitch <input id="glitch" type="range" min="0" max="100" value="0"></label>
<label><span><input id="rain" type="checkbox"> matrix rain backdrop</span></label>
<label><span><input id="crt" type="checkbox"> CRT scanlines</span></label>
<label><span><input id="cycle" type="checkbox"> auto hue cycle</span></label>
<label>Light rays <input id="rays" type="range" min="0" max="100" value="25"></label>
<label><span><input id="spot" type="checkbox" checked> cursor spotlight + sparks</span></label>
<label><span><input id="wire" type="checkbox"> wireframe (edges only)</span></label>
<label><span><input id="aq" type="checkbox" checked> auto quality (keeps fps up)</span></label>
<label><span><input id="invert" type="checkbox"> invert luminance</span></label>
<label><span><input id="mirror" type="checkbox" checked> mirror webcam</span></label>
</div>
</aside></main>
<div id="tip"></div>
<div id="help"><b>Shortcuts</b><br>T theatre mode<br>F fullscreen (or double-click)<br>Space play / pause<br>Left / Right seek 5s<br>M mic &middot; R record<br>? this help</div>
<script>
const $=id=>document.getElementById(id);
const out=$('out'),octx=out.getContext('2d',{alpha:false});
const mk=()=>document.createElement('canvas');

const gA=mk(),gAc=gA.getContext('2d'),gB=mk(),gBc=gB.getContext('2d');

let mode='demo',stream=null;
const SETS={classic:" .,:;-~=+*#%&$@",dense:" .:-=+*#%@",kana:" ･ｦｱｳｴｵｶｷｹｺｻｼｽｾﾀﾂﾃﾅﾆﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ",blocks:" ·░▒▓█"};let RAMP=SETS.classic,CH=RAMP+"|-/\\'*",NR=RAMP.length;const L=32;

let STOPS=PRESETS.violet;
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(b=>(b/16-.47)*.9);
const tr=mk(),trc=tr.getContext('2d',{alpha:false}),pc=mk(),pcx=pc.getContext('2d');

let atlas=null,acw=0;
function buildAtlas(cw,ch){atlas=mk();atlas.width=CH.length*cw;atlas.height=L*ch;const c=atlas.getContext('2d');
c.font=`bold ${Math.round(ch*.92)}px ui-monospace,Menlo,Consolas,monospace`;c.textAlign='center';c.textBaseline='middle';
for(let l=0;l<L;l++){const [r,g,b]=pal(l/(L-1));c.fillStyle=`rgb(${r},${g},${b})`;
for(let i=0;i<CH.length;i++)c.fillText(CH[i],i*cw+cw/2,l*ch+ch/2+1)}acw=cw}
function drawDemo(t){const c=dctx,w=640,h=360;c.globalCompositeOperation='source-over';c.fillStyle='#000';c.fillRect(0,0,w,h);c.globalCompositeOperation='lighter';
for(let i=0;i<5;i++){const x=w/2+Math.cos(t*.7+i*1.9)*210*Math.sin(t*.3+i),y=h/2+Math.sin(t*.9+i*2.3)*110,r=50+30*Math.sin(t*1.3+i);

c.lineWidth=16;c.strokeStyle='#ddd';c.beginPath();c.ellipse(w/2,h/2,130+30*Math.sin(t),70+20*Math.cos(t*1.2),t*.5,0,7);c.stroke();
c.fillStyle='#fff';c.beginPath();c.arc(w/2+Math.cos(t*2)*60,h/2+Math.sin(t*2)*40,22,0,7);c.fill();c.globalCompositeOperation='source-over'}
const msg=t=>$('msg').textContent=t||'';
function setMode(m){mode=m;['bDemo','bCam'].forEach(id=>$(id).classList.remove('on'));if(m==='demo')$('bDemo').classList.add('on');if(m==='cam')$('bCam').classList.add('on')}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
$('bDemo').onclick=()=>{stopCam();vid.pause();setMode('demo');msg()};
$('bCam').onclick=async()=>{try{stopCam();stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:360}});vid.srcObject=stream;vid.loop=false;await vid.play();setMode('cam');msg()}catch(e){msg('Webcam unavailable here (permission or sandbox). Try Load video or the demo feed.')}};
async function loadFile(f){try{stopCam();vid.srcObject=null;vid.src=URL.createObjectURL(f);vid.loop=true;vid.playbackRate=+$('spd').value;await vid.play();setMode('file');msg()}catch(err){msg('Could not play that file in this page. Try an mp4 or webm.')}}
$('file').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0])};
let S,PR,M,V,GX,GY,hist=new Uint32Array(64),lo=0,hi=1,cols0=0,rows0=0;
const MAXP=2200,px=new Float32Array(MAXP),py=new Float32Array(MAXP),vx=new Float32Array(MAXP),vy=new Float32Array(MAXP),pl=new Float32Array(MAXP),pk=new Uint8Array(MAXP);let np=0;
let last=performance.now(),fc=0,ft=0,lvl=0,an=null,adata=null,paused=false,waves=[],rain=[],scan=null,hh=0;
function updAudio(){if(!an)return;an.getByteFrequencyData(adata);let s=0;for(let i=0;i<8;i++)s+=adata[i];const pl0=lvl;lvl+=(Math.min(1,s/8/180)-lvl)*.35;if(lvl>.6&&pl0<=.6)waves.push({x:cols0/2,y:rows0/2,r:0})}
function hueTick(){if($('cycle').checked){hh=(hh+.6)%360;out.style.filter=`hue-rotate(${hh}deg)`}}
function drawRain(cols,rows,cw,ch){if(rain.length!==cols)rain=Array.from({length:cols},()=>({y:Math.random()*rows,s:.15+Math.random()*.35,n:6+(Math.random()*12|0)}));
for(let x=0;x<cols;x++){const r=rain[x];r.y+=r.s;if(r.y-r.n>rows){r.y=0;r.s=.15+Math.random()*.35;r.n=6+(Math.random()*12|0)}
for(let k=0;k<r.n;k++){const y=(r.y|0)-k;if(y<0||y>=rows||V[y*cols+x]>.04)continue;const lv=k===0?L-6:Math.max(1,(L*.5*(1-k/r.n))|0),ci=1+((Math.random()*(NR-1))|0);bctx.drawImage(atlas,ci*cw,lv*ch,cw,ch,x*cw,y*ch,cw,ch)}}}
function frame(ts){requestAnimationFrame(frame);if(paused)return;updAudio();hueTick();
let el,vw,vh;
if(mode==='demo'){drawDemo(ts/1000);el=demo;vw=640;vh=360}else if(vid.readyState>=2&&vid.videoWidth){el=vid;vw=vid.videoWidth;vh=vid.videoHeight}else return;
const cols=+$('cols').value,rows=Math.max(8,Math.round(cols*vh/vw*.5));
const wrapW=out.parentElement.clientWidth,dpr=Math.min(devicePixelRatio||1,2);
const q=+$('qual').value,cw=Math.max(5,Math.min(26,Math.round(wrapW*dpr*q/cols))),ch=cw*2;
if(cw!==acw)buildAtlas(cw,ch);
const W=cols*cw,H=rows*ch;
if(out.width!==W||out.height!==H){out.width=buf.width=tr.width=W;out.height=buf.height=tr.height=H;gA.width=Math.ceil(W/4);gA.height=Math.ceil(H/4);gB.width=Math.ceil(W/12);gB.height=Math.ceil(H/12)}
if(cols!==cols0||rows!==rows0){cols0=cols;rows0=rows;const n=cols*rows;S=new Float32Array(n);PR=new Float32Array(n);M=new Float32Array(n);V=new Float32Array(n);GX=new Float32Array(n);GY=new Float32Array(n);src.width=cols;src.height=rows;np=0}
sctx.save();if(mode==='cam'&&$('mirror').checked){sctx.translate(cols,0);sctx.scale(-1,1)}if(mode==='demo'){sctx.drawImage(el,0,0,cols,rows)}else{if(pc.width!==cols*3||pc.height!==rows*3){pc.width=cols*3;pc.height=rows*3}pcx.imageSmoothingQuality='high';pcx.drawImage(el,0,0,cols*3,rows*3);sctx.imageSmoothingQuality='high';sctx.drawImage(pc,0,0,cols,rows)}sctx.restore();
const d=sctx.getImageData(0,0,cols,rows).data,n=cols*rows;
const sm=+$('smooth').value/100,gam=1/(+$('contrast').value/100),inv=$('invert').checked;
hist.fill(0);
for(let i=0;i<n;i++){const o=i*4,raw=(.2126*d[o]+.7152*d[o+1]+.0722*d[o+2])/255;
const mo=Math.abs(raw-PR[i]);PR[i]=raw;M[i]=Math.max(mo,M[i]*.82);
S[i]=S[i]*sm+raw*(1-sm);hist[Math.min(63,S[i]*64|0)]++}
let acc=0,l2=0,h2=1;for(let b=0;b<64;b++){acc+=hist[b];if(acc>n*.02){l2=b/64;break}}acc=0;for(let b=63;b>=0;b--){acc+=hist[b];if(acc>n*.02){h2=(b+1)/64;break}}
lo+=(l2-lo)*.1;hi+=(h2-hi)*.1;const rg=Math.max(.15,hi-lo);
for(let i=0;i<n;i++){let v=(S[i]-lo)/rg;v=v<0?0:v>1?1:v;v=Math.pow(v,gam);V[i]=inv?1-v:v}
for(let y=1;y<rows-1;y++)for(let x=1;x<cols-1;x++){const i=y*cols+x;
GX[i]=(V[i-cols+1]+2*V[i+1]+V[i+cols+1])-(V[i-cols-1]+2*V[i-1]+V[i+cols-1]);
GY[i]=(V[i+cols-1]+2*V[i+cols]+V[i+cols+1])-(V[i-cols-1]+2*V[i-cols]+V[i-cols+1])}
const eth=1.9-($('edge').value/100)*1.5,sp=$('sparks').value/100*(1+lvl*3),edgeOn=$('edge').value>0,spotOn=$('spot').checked,wire=$('wire').checked;
bctx.clearRect(0,0,W,H);for(const w of waves)w.r+=1.1;waves=waves.filter(w=>w.r<Math.max(cols,rows)*1.3);if($('rain').checked)drawRain(cols,rows,cw,ch);
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=y*cols+x,o=i*4,v=V[i];
const gx=GX[i],gy=GY[i],em=Math.sqrt(gx*gx+gy*gy),isE=edgeOn&&em>eth;

let ci=Math.min(NR-1,Math.max(0,(v*(NR-1)+BAY[(x&3)+((y&3)<<2)]+.5)|0));
if(isE){const a=((Math.atan2(gy,gx)*57.2958)+180)%180;ci=NR+(a<22.5||a>=157.5?0:a<67.5?2:a<112.5?1:3)}
if(spotOn){const sx=x-mx,sy=(y-my)*2,sd=sx*sx+sy*sy;if(sd<64)t=Math.min(1,t+.5*(1-sd/64))}
if(ring){t=1;if(ci===0)ci=NR>5?5:1}
if(ci===0)continue;

if(sp>0&&np<MAXP&&(isE||v>.55)){const mm=M[i];if(mm>.06&&Math.random()<sp*.22*Math.min(1,mm*4)){const k=np++;px[k]=x;py[k]=y;vx[k]=(gx*.5+Math.random()-.5)*.12;vy[k]=-.04+Math.random()*.08;pl[k]=1;pk[k]=Math.random()<.5?NR+4:NR+5}}}
for(let k=0;k<np;k++){pl[k]-=.022+Math.random()*.01;vy[k]+=.012;px[k]+=vx[k];py[k]+=vy[k];
if(pl[k]<=0||py[k]>=rows||px[k]<0||px[k]>=cols){np--;px[k]=px[np];py[k]=py[np];vx[k]=vx[np];vy[k]=vy[np];pl[k]=pl[np];pk[k]=pk[np];k--;continue}
const lv=Math.min(L-1,(.35+pl[k]*.65)*(L-1)|0);bctx.drawImage(atlas,pk[k]*cw,lv*ch,cw,ch,px[k]*cw,py[k]*ch,cw,ch)}
